<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Nepal National Crimson Gradient -->
    <linearGradient id="nepalCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#c8102e" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Auspicious Sacred Gold Gradient -->
    <linearGradient id="sacredGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Elevation Filter -->
    <filter id="patroElev" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#450a0a" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Canvas in Nepal Crimson -->
  <rect width="512" height="512" rx="120" fill="url(#nepalCrimson)" />
  <!-- Hairline Golden Outer Inset -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="url(#sacredGold)" stroke-width="3" opacity="0.4" />

  <!-- Modern Geometric Patro Sheet -->
  <g filter="url(#patroElev)">
    <!-- Main Sheet Body -->
    <rect x="88" y="96" width="336" height="336" rx="40" fill="#ffffff" />
    
    <!-- Top Binding Header in Crimson -->
    <path d="M 88 140 A 40 40 0 0 1 128 96 L 384 96 A 40 40 0 0 1 424 140 L 424 168 L 88 168 Z" fill="#991b1b" />
    <!-- Golden Binding Line -->
    <line x1="88" y1="168" x2="424" y2="168" stroke="url(#sacredGold)" stroke-width="3" />

    <!-- Two Polished Brass Hanging Rings -->
    <rect x="160" y="78" width="28" height="42" rx="10" fill="url(#sacredGold)" stroke="#78350f" stroke-width="2" />
    <rect x="324" y="78" width="28" height="42" rx="10" fill="url(#sacredGold)" stroke="#78350f" stroke-width="2" />
    <circle cx="174" cy="99" r="6" fill="#ffffff" opacity="0.6" />
    <circle cx="338" cy="99" r="6" fill="#ffffff" opacity="0.6" />

    <!-- Sacred Celestial Emblems (चन्द्र र सूर्य) Inside Patro Sheet -->
    
    <!-- 1. Chandra (Crescent Moon with Aura) -->
    <!-- Center x=256, y=232 -->
    <g transform="translate(256, 230)">
      <!-- Crescent Body -->
      <path d="M -54 -10 A 56 56 0 0 0 54 -10 A 46 46 0 0 1 -54 -10 Z" fill="url(#sacredGold)" />
      <!-- Moon Star Disc -->
      <circle cx="0" cy="-22" r="13" fill="url(#sacredGold)" />
      <circle cx="0" cy="-22" r="6" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- 2. Surya (Radiant 12-Ray Sun) -->
    <!-- Center x=256, y=326 -->
    <g transform="translate(256, 326)">
      <!-- Outer 12 Rays -->
      <path d="M 0 -46 L 7 -32 L 23 -40 L 20 -23 L 38 -20 L 27 -7 L 46 0 L 27 7 L 38 20 L 20 23 L 23 40 L 7 32 L 0 46 L -7 32 L -23 40 L -20 23 L -38 20 L -27 7 L -46 0 L -27 -7 L -38 -20 L -20 -23 L -23 -40 L -7 -32 Z" fill="url(#sacredGold)" />
      <!-- Inner Sun Core -->
      <circle cx="0" cy="0" r="22" fill="url(#nepalCrimson)" />
      <circle cx="0" cy="0" r="16" fill="url(#sacredGold)" />
      <circle cx="0" cy="0" r="7" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- Devanagari "सँ" (Sangalo) Brand Monogram Base -->
    <text x="256" y="414" text-anchor="middle" font-family="-apple-system, Mukta, sans-serif" font-size="20" font-weight="900" fill="#991b1b" letter-spacing="4">सँगालो</text>
  </g>
</svg>
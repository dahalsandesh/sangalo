<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Emerald Pine to Vibrant Jade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Golden Morning Sun -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Himalayan Mountain Snow Peak -->
    <linearGradient id="peakLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="peakShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Elevation Shadow -->
    <filter id="elev" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Modern Squircle Body -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" />

  <!-- Harmonious Golden Sun -->
  <circle cx="256" cy="180" r="72" fill="url(#sunGrad)" opacity="0.95" />

  <!-- Himalayan Mountain Silhouette (Faceted Modern Low-Poly Geometry) -->
  <!-- Left Side Wing Peak -->
  <polygon points="56,350 170,210 270,350" fill="#e2e8f0" opacity="0.9" />
  <polygon points="170,210 130,260 180,280 170,210" fill="#94a3b8" opacity="0.45" />

  <!-- Right Side Wing Peak -->
  <polygon points="240,350 340,210 456,350" fill="#e2e8f0" opacity="0.9" />
  <polygon points="340,210 390,265 345,285 340,210" fill="#94a3b8" opacity="0.45" />

  <!-- Majestic Central Himalayan Crest -->
  <polygon points="120,360 256,128 392,360" fill="url(#peakLight)" filter="url(#elev)" />
  <polygon points="256,128 200,215 264,250 256,128" fill="url(#peakShadow)" />
  <polygon points="256,128 264,250 230,310 256,360 392,360 256,128" fill="#cbd5e1" opacity="0.35" />

  <!-- Authentic Pagoda Home Silhouette (Base of Household Security) -->
  <!-- Upper Eaves -->
  <path d="M176 350 L256 280 L336 350 Z" fill="#b45309" filter="url(#elev)" />
  <path d="M160 352 L256 268 L352 352 L340 358 L256 284 L172 358 Z" fill="#78350f" />

  <!-- Home Sanctuary Sanctuary Base -->
  <rect x="194" y="352" width="124" height="76" rx="8" fill="#fffbeb" />
  <!-- Authentic Arched Doorway -->
  <path d="M236 428 L236 384 A 20 20 0 0 1 276 384 L276 428 Z" fill="#b45309" />
  <circle cx="270" cy="406" r="2.5" fill="#fde047" />

  <!-- Minimalist Star-Burst Sparkle in Sun Crest -->
  <circle cx="256" cy="180" r="3" fill="#ffffff" opacity="0.8" />
</svg>
